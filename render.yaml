# Create and provision PostgreSQL first, following docs/operations.md. Keeping
# it out of this service Blueprint avoids asking for role URLs before the
# database and roles exist, and prevents an owner URL from being auto-wired.
services:
  - type: web
    name: jobandkill-career-writer
    runtime: python
    plan: 1c-2g
    region: singapore
    repo: https://github.com/jonandkill/Jobandkill
    branch: jobandkill1
    autoDeployTrigger: "off"
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements-production.txt
    # Sync workers bound both concurrency and stuck-request lifetime. Render
    # sends SIGTERM; Gunicorn drains requests within its 25-second deadline.
    startCommand: scripts/run_with_database_role.sh gunicorn 'jobandkill.wsgi:create_app()' --preload --bind 0.0.0.0:$PORT --worker-class sync --workers 2 --threads 1 --timeout 30 --graceful-timeout 25 --max-requests 1000 --max-requests-jitter 100 --limit-request-line 4094 --limit-request-fields 50 --limit-request-field_size 8190 --logger-class jobandkill.gunicorn_logging.RedactingLogger
    healthCheckPath: /api/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: JOBNKILL_ENV
        value: production
      - key: JOBNKILL_HOST
        value: 0.0.0.0
      - key: JOBNKILL_DATABASE_ROLE
        value: web
      - key: JOBNKILL_WEB_DATABASE_URL
        # Required before first start: private URL for jobandkill_web, never
        # the Render database owner URL. Append ?sslmode=require. See docs/operations.md.
        sync: false
      - key: JOBNKILL_AUTO_MIGRATE
        value: "0"
      - key: JOBNKILL_AUTH_RATE_SECRET
        generateValue: true
      - key: JOBNKILL_PUBLIC_URL
        # Exact final HTTPS origin. Do not rely on an undocumented provider
        # variable; set this after the provisional service URL is known.
        sync: false
      - key: JOBNKILL_MAIL_TRANSPORT
        value: resend
      - key: JOBNKILL_RESEND_API_KEY
        sync: false
      - key: JOBNKILL_RESEND_FROM
        sync: false
      - key: JOBNKILL_PRIVACY_POLICY_URL
        sync: false
      - key: JOBNKILL_PRIVACY_POLICY_VERSION
        sync: false
      - key: JOBNKILL_PRIVACY_POLICY_SHA256
        sync: false
      - key: JOBNKILL_OVERSEAS_TRANSFER_REQUIRED
        value: "1"
      - key: JOBNKILL_OVERSEAS_TRANSFER_POLICY_URL
        sync: false
      - key: JOBNKILL_OVERSEAS_TRANSFER_VERSION
        sync: false
      - key: JOBNKILL_OVERSEAS_TRANSFER_SHA256
        sync: false
      - key: JOBNKILL_DRAFT_RETENTION_DAYS
        sync: false

  - type: cron
    name: jobandkill-daily-sync
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    repo: https://github.com/jonandkill/Jobandkill
    branch: jobandkill1
    autoDeployTrigger: "off"
    schedule: "35 18 * * *"
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements-production.txt
    startCommand: >-
      scripts/run_with_database_role.sh sh -c
      'python -m jobandkill doctor --production --collector-only --require-api
      && python -m jobandkill sync --all
      && python -m jobandkill process-documents --limit 20 --fail-on-error'
    envVars:
      - key: JOBNKILL_ENV
        value: production
      - key: JOBNKILL_DATABASE_ROLE
        value: collector
      - key: JOBNKILL_COLLECTOR_DATABASE_URL
        # Private URL for jobandkill_collector only. This role has no grants
        # on users, consents, login tokens, sessions, or user drafts. Append
        # ?sslmode=require.
        sync: false
      - key: JOBNKILL_AUTO_MIGRATE
        value: "0"
      - key: JOBNKILL_ALIO_API_URL_TEMPLATE
        sync: false
      - key: JOBNKILL_ALIO_SERVICE_KEY
        sync: false
      - key: JOBNKILL_STORAGE_BACKEND
        value: s3
      - key: JOBNKILL_S3_BUCKET
        sync: false
      - key: JOBNKILL_S3_REGION
        value: ap-northeast-2
      - key: JOBNKILL_S3_PREFIX
        value: documents
      - key: JOBNKILL_S3_ENDPOINT_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: JOBNKILL_S3_ENCRYPTION
        value: AES256

  - type: cron
    name: jobandkill-privacy-cleanup
    runtime: python
    plan: 0.5c-512mb
    region: singapore
    repo: https://github.com/jonandkill/Jobandkill
    branch: jobandkill1
    autoDeployTrigger: "off"
    schedule: "20 18 * * *"
    buildCommand: python -m pip install --upgrade pip && python -m pip install -r requirements-production.txt
    startCommand: scripts/run_with_database_role.sh python -m jobandkill cleanup-personal-data --execute
    envVars:
      - key: JOBNKILL_ENV
        value: production
      - key: JOBNKILL_DATABASE_ROLE
        value: cleanup
      - key: JOBNKILL_CLEANUP_DATABASE_URL
        # Private URL for jobandkill_cleanup only. This role can delete expired
        # rows but cannot read email addresses or draft payloads. Append
        # ?sslmode=require.
        sync: false
      - key: JOBNKILL_AUTO_MIGRATE
        value: "0"
      - key: JOBNKILL_DRAFT_RETENTION_DAYS
        sync: false
