name: CI

on:
  push:
    branches: [jobandkill1]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install -r requirements-production.txt
      - run: python -m compileall -q jobandkill
      - run: python -m unittest discover -s tests -v
        env:
          JOBNKILL_QUIET: "1"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: node --check web/app.js
      - run: node --check web/composer.js
      - run: node --test tests/test_composer.cjs

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: jobandkill
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: jobandkill_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobandkill -d jobandkill_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-production.txt
      - run: python -m unittest discover -s tests -p 'test_postgres.py' -v
        env:
          JOBNKILL_TEST_POSTGRES_URL: postgresql://jobandkill:test-password@127.0.0.1:5432/jobandkill_test
          JOBNKILL_ENV: test
      - name: Provision least-privilege runtime roles
        run: psql --no-psqlrc --set ON_ERROR_STOP=1 --file scripts/provision_database_roles.sql
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: jobandkill_test
          PGUSER: jobandkill
          PGPASSWORD: test-password
      - name: Set disposable CI-only role passwords
        run: >-
          psql --no-psqlrc --set ON_ERROR_STOP=1
          --command "ALTER ROLE jobandkill_web PASSWORD 'web-test-password';
          ALTER ROLE jobandkill_collector PASSWORD 'collector-test-password';
          ALTER ROLE jobandkill_cleanup PASSWORD 'cleanup-test-password';"
        env:
          PGHOST: 127.0.0.1
          PGPORT: "5432"
          PGDATABASE: jobandkill_test
          PGUSER: jobandkill
          PGPASSWORD: test-password
      - name: Verify runtime role isolation
        run: python -m unittest tests.test_postgres_roles -v
        env:
          JOBNKILL_TEST_WEB_POSTGRES_URL: postgresql://jobandkill_web:web-test-password@127.0.0.1:5432/jobandkill_test
          JOBNKILL_TEST_COLLECTOR_POSTGRES_URL: postgresql://jobandkill_collector:collector-test-password@127.0.0.1:5432/jobandkill_test
          JOBNKILL_TEST_CLEANUP_POSTGRES_URL: postgresql://jobandkill_cleanup:cleanup-test-password@127.0.0.1:5432/jobandkill_test

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: false
          tags: jobandkill:test
