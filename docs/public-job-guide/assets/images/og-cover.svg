<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc"><title id="title">전국 공공채용, 처음부터 합격까지</title><desc id="desc">정대영·잡앤킬의 2026 공공취업 실전 전자책 공유 이미지</desc><rect width="1200" height="630" fill="#102C46"/><rect x="54" y="48" width="1092" height="534" rx="25" fill="#F8F5EE"/><rect x="54" y="48" width="24" height="534" rx="12" fill="#D4B36A"/><text x="120" y="126" fill="#B2842B" font-family="Noto Sans KR,sans-serif" font-size="27" font-weight="800">2026 실전 개정판 · 일반 취준생 대상</text><text x="120" y="236" fill="#15324B" font-family="Noto Sans KR,sans-serif" font-size="72" font-weight="900">전국 공공채용,</text><text x="120" y="325" fill="#15324B" font-family="Noto Sans KR,sans-serif" font-size="72" font-weight="900">처음부터 합격까지</text><text x="124" y="389" fill="#52606D" font-family="Noto Sans KR,sans-serif" font-size="28">기관의 판단 구조를 읽고 지원자격·전형·면접으로 연결하는 실전 지도</text><g font-family="Noto Sans KR,sans-serif" font-size="24" font-weight="800" text-anchor="middle"><rect x="122" y="452" width="205" height="62" rx="31" fill="#DCEAF7"/><text x="224" y="493" fill="#17324D">채용 779건</text><rect x="346" y="452" width="225" height="62" rx="31" fill="#D9EAD3"/><text x="458" y="493" fill="#1B5E20">사회복지사</text><rect x="590" y="452" width="278" height="62" rx="31" fill="#FCE8B2"/><text x="729" y="493" fill="#8A4B08">장애인 우대·제한경쟁</text></g><text x="1092" y="535" text-anchor="end" fill="#17324D" font-family="Noto Sans KR,sans-serif" font-size="27" font-weight="800">정대영 · 잡앤킬</text></svg>