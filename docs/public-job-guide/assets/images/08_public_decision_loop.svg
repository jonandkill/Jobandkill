<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">좋은 판단은 확인–비교–보고–기록의 순환이다</title><desc id="desc">목적과 사실을 확인하고 규정과 자원을 점검해 대안을 비교하고 보고, 실행, 개선하는 흐름</desc><defs><style>text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17324D}.title{font-size:34px;font-weight:800}.sub{font-size:17px;fill:#52606D}.head{font-size:19px;font-weight:800}.body{font-size:14px;fill:#52606D}.num{font-size:16px;font-weight:900;fill:#fff}.foot{font-size:16px;font-weight:800}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2477B3"/></marker></defs><rect width="1200" height="675" fill="#F7FAFC"/><text x="60" y="65" class="title">좋은 판단은 확인–비교–보고–기록의 순환이다</text><text x="60" y="96" class="sub">기관마다 결재선은 달라도 실무자가 준비해야 할 판단 재료는 닮아 있다</text><rect x="46" y="175" width="207.2" height="290" rx="18" fill="#EAF4FA" stroke="#2477B3" stroke-width="2"/><circle cx="80" cy="213" r="20" fill="#2477B3"/><text x="80" y="220" text-anchor="middle" class="num">1</text><text x="149.6" y="267" text-anchor="middle" class="head">목적·대상</text><text x="149.6" y="315" text-anchor="middle" class="body">누구에게 어떤</text><text x="149.6" y="345" text-anchor="middle" class="body">변화를 만들까</text><path d="M253.2 320 H267.2" stroke="#2477B3" stroke-width="4" marker-end="url(#arrow)"/><rect x="271.2" y="175" width="207.2" height="290" rx="18" fill="#FFF1D6" stroke="#D97706" stroke-width="2"/><circle cx="305.2" cy="213" r="20" fill="#D97706"/><text x="305.2" y="220" text-anchor="middle" class="num">2</text><text x="374.79999999999995" y="267" text-anchor="middle" class="head">사실·관계자</text><text x="374.79999999999995" y="315" text-anchor="middle" class="body">의견과 사실</text><text x="374.79999999999995" y="345" text-anchor="middle" class="body">영향을 구분</text><path d="M478.4 320 H492.4" stroke="#2477B3" stroke-width="4" marker-end="url(#arrow)"/><rect x="496.4" y="175" width="207.2" height="290" rx="18" fill="#EEF2F6" stroke="#52606D" stroke-width="2"/><circle cx="530.4" cy="213" r="20" fill="#52606D"/><text x="530.4" y="220" text-anchor="middle" class="num">3</text><text x="600" y="267" text-anchor="middle" class="head">규정·자원</text><text x="600" y="315" text-anchor="middle" class="body">권한·예산·인력</text><text x="600" y="345" text-anchor="middle" class="body">기한·위험</text><path d="M703.5999999999999 320 H717.5999999999999" stroke="#2477B3" stroke-width="4" marker-end="url(#arrow)"/><rect x="721.5999999999999" y="175" width="207.2" height="290" rx="18" fill="#E9F5F1" stroke="#0F766E" stroke-width="2"/><circle cx="755.5999999999999" cy="213" r="20" fill="#0F766E"/><text x="755.5999999999999" y="220" text-anchor="middle" class="num">4</text><text x="825.1999999999999" y="267" text-anchor="middle" class="head">대안·보고</text><text x="825.1999999999999" y="315" text-anchor="middle" class="body">효과와 공정성</text><text x="825.1999999999999" y="345" text-anchor="middle" class="body">권고안 공유</text><path d="M928.8 320 H942.8" stroke="#2477B3" stroke-width="4" marker-end="url(#arrow)"/><rect x="946.8" y="175" width="207.2" height="290" rx="18" fill="#F1ECFA" stroke="#6B4EA2" stroke-width="2"/><circle cx="980.8" cy="213" r="20" fill="#6B4EA2"/><text x="980.8" y="220" text-anchor="middle" class="num">5</text><text x="1050.3999999999999" y="267" text-anchor="middle" class="head">실행·개선</text><text x="1050.3999999999999" y="315" text-anchor="middle" class="body">결정 근거 기록</text><text x="1050.3999999999999" y="345" text-anchor="middle" class="body">성과를 환류</text><rect x="180" y="535" width="840" height="65" rx="32" fill="#17324D"/><text x="600" y="575" text-anchor="middle" class="foot" fill="#fff">권한 안에서는 실행하고 예외와 중요한 위험은 대안을 갖춰 조기에 보고한다</text></svg>