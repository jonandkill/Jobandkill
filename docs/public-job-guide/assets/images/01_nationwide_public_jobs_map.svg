<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">전국 공공채용 탐색 지도</title>
  <desc id="desc">일반 취업준비생이 중앙 공공기관 채용과 지방공기업·출자출연기관 채용을 각각 탐색한 뒤, 원문 공고를 검증하고 지원 관리표로 합치는 과정을 보여 주는 개념도.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#52606D"/>
    </marker>
    <style>
      text{font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo",sans-serif;fill:#17324D}
      .title{font-size:34px;font-weight:800}.sub{font-size:17px;fill:#52606D}.h{font-size:22px;font-weight:800}.body{font-size:16px}.small{font-size:14px;fill:#52606D}.chip{font-size:13px;font-weight:700}.white{fill:#fff}.line{stroke:#52606D;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1200" height="675" fill="#F7FAFC"/>
  <circle cx="1105" cy="72" r="110" fill="#DCEFF8"/>
  <circle cx="76" cy="635" r="125" fill="#E4F3EF"/>
  <text x="64" y="66" class="title">전국 공공채용 탐색 지도</text>
  <text x="64" y="96" class="sub">기관 이름보다 먼저 ‘채용 원문이 모이는 경로’를 잡는다</text>

  <rect x="54" y="144" width="216" height="390" rx="24" fill="#FFFFFF" stroke="#C8D7E3" stroke-width="2" filter="url(#shadow)"/>
  <circle cx="162" cy="213" r="48" fill="#17324D"/>
  <path d="M138 214h48M162 190v48" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round"/>
  <text x="162" y="288" text-anchor="middle" class="h">나의 탐색 기준</text>
  <text x="86" y="332" class="body">① 희망 직무</text>
  <text x="86" y="368" class="body">② 고용 형태</text>
  <text x="86" y="404" class="body">③ 근무 지역</text>
  <text x="86" y="440" class="body">④ 신입·경력 구분</text>
  <rect x="82" y="470" width="160" height="38" rx="19" fill="#FFF1D6"/>
  <text x="162" y="495" text-anchor="middle" class="chip" fill="#8A4B00">검색어 3개 이내</text>

  <path d="M276 270 C315 270 320 237 352 237" class="line"/>
  <path d="M276 410 C315 410 320 439 352 439" class="line"/>

  <rect x="360" y="139" width="378" height="196" rx="24" fill="#EAF4FA" stroke="#2477B3" stroke-width="3" filter="url(#shadow)"/>
  <rect x="386" y="165" width="78" height="34" rx="17" fill="#2477B3"/>
  <text x="425" y="188" text-anchor="middle" class="chip white">중앙</text>
  <text x="386" y="233" class="h">공공기관 채용</text>
  <text x="386" y="270" class="body">JOB-ALIO 중심으로 공기업·준정부기관·</text>
  <text x="386" y="297" class="body">기타공공기관의 진행 중 공고 탐색</text>
  <circle cx="674" cy="224" r="32" fill="#FFFFFF"/>
  <path d="M660 228c12 12 27 4 27-9 0-11-9-20-20-20-13 0-22 12-19 24 3 13 17 21 30 15" fill="none" stroke="#2477B3" stroke-width="5" stroke-linecap="round"/>

  <rect x="360" y="359" width="378" height="196" rx="24" fill="#E9F5F1" stroke="#0F766E" stroke-width="3" filter="url(#shadow)"/>
  <rect x="386" y="385" width="78" height="34" rx="17" fill="#0F766E"/>
  <text x="425" y="408" text-anchor="middle" class="chip white">지방</text>
  <text x="386" y="453" class="h">지방공공기관 채용</text>
  <text x="386" y="490" class="body">클린아이 잡플러스와 시·도·재단 채용을</text>
  <text x="386" y="517" class="body">함께 확인해 지역 채용의 누락을 줄임</text>
  <g transform="translate(607 399)">
    <rect x="0" y="0" width="104" height="66" rx="10" fill="#FFFFFF"/>
    <circle cx="27" cy="25" r="10" fill="#0F766E"/><circle cx="53" cy="18" r="8" fill="#0F766E"/><circle cx="78" cy="29" r="11" fill="#0F766E"/>
    <path d="M20 43h66" stroke="#0F766E" stroke-width="4" stroke-linecap="round"/>
  </g>

  <path d="M746 237 H807" class="line"/>
  <path d="M746 457 H807" class="line"/>
  <path d="M833 317 V343" class="line"/>

  <rect x="820" y="149" width="326" height="166" rx="24" fill="#FFFFFF" stroke="#D97706" stroke-width="3" filter="url(#shadow)"/>
  <text x="851" y="195" class="h">원문 공고 검증</text>
  <g class="body">
    <text x="851" y="233">✓ 지원자격·제한경쟁</text>
    <text x="851" y="264">✓ 전형·가점·증빙</text>
    <text x="851" y="295">✓ 접수 마감 시각</text>
  </g>

  <rect x="820" y="365" width="326" height="190" rx="24" fill="#17324D" filter="url(#shadow)"/>
  <text x="851" y="413" class="h white">하나의 지원 관리표</text>
  <g class="body white">
    <text x="851" y="453">관심 → 지원예정 → 지원완료</text>
    <text x="851" y="486">서류 → 필기 → 면접 → 최종</text>
  </g>
  <rect x="851" y="510" width="220" height="27" rx="13" fill="#2477B3"/>
  <rect x="851" y="510" width="139" height="27" rx="13" fill="#35B6A2"/>

  <text x="600" y="625" text-anchor="middle" class="small">핵심 원칙: 목록은 탐색용, 지원 판단은 반드시 기관 원문 공고문으로 확정</text>
</svg>
