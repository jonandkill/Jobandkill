<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">30일의 목표는 지원 가능한 공고를 운영하는 체계다</title><desc id="desc">1주 지원기준표 2주 공고분류표 3주 경험과 오답카드 4주 면접과 다음 계획으로 이어지는 실행 지도</desc><defs><style>text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17324D}.title{font-size:34px;font-weight:800}.sub{font-size:17px;fill:#52606D}.head{font-size:19px;font-weight:800}.body{font-size:14px;fill:#52606D}.num{font-size:16px;font-weight:900;fill:#fff}.foot{font-size:16px;font-weight:800}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2477B3"/></marker></defs><rect width="1200" height="675" fill="#F7FAFC"/><text x="60" y="65" class="title">30일의 목표는 지원 가능한 공고를 운영하는 체계다</text><text x="60" y="96" class="sub">매주 공부시간이 아니라 다음 달에도 재사용할 산출물을 남긴다</text><rect x="46" y="175" width="263.5" height="290" rx="18" fill="#EAF4FA" stroke="#2477B3" stroke-width="2"/><circle cx="80" cy="213" r="20" fill="#2477B3"/><text x="80" y="220" text-anchor="middle" class="num">1</text><text x="177.75" y="267" text-anchor="middle" class="head">1주 기준</text><text x="177.75" y="315" text-anchor="middle" class="body">고용형태·지역</text><text x="177.75" y="345" text-anchor="middle" class="body">지원기준표</text><path d="M309.5 320 H323.5" stroke="#2477B3" stroke-width="4" marker-end="url(#arrow)"/><rect x="327.5" y="175" width="263.5" height="290" rx="18" fill="#FFF1D6" stroke="#D97706" stroke-width="2"/><circle cx="361.5" cy="213" r="20" fill="#D97706"/><text x="361.5" y="220" text-anchor="middle" class="num">2</text><text x="459.25" y="267" text-anchor="middle" class="head">2주 분류</text><text x="459.25" y="315" text-anchor="middle" class="body">공고 20건 판정</text><text x="459.25" y="345" text-anchor="middle" class="body">공고분류표</text><path d="M591 320 H605" stroke="#2477B3" stroke-width="4" marker-end="url(#arrow)"/><rect x="609" y="175" width="263.5" height="290" rx="18" fill="#EEF2F6" stroke="#52606D" stroke-width="2"/><circle cx="643" cy="213" r="20" fill="#52606D"/><text x="643" y="220" text-anchor="middle" class="num">3</text><text x="740.75" y="267" text-anchor="middle" class="head">3주 준비</text><text x="740.75" y="315" text-anchor="middle" class="body">STAR+5·진단</text><text x="740.75" y="345" text-anchor="middle" class="body">경험·오답카드</text><path d="M872.5 320 H886.5" stroke="#2477B3" stroke-width="4" marker-end="url(#arrow)"/><rect x="890.5" y="175" width="263.5" height="290" rx="18" fill="#E9F5F1" stroke="#0F766E" stroke-width="2"/><circle cx="924.5" cy="213" r="20" fill="#0F766E"/><text x="924.5" y="220" text-anchor="middle" class="num">4</text><text x="1022.25" y="267" text-anchor="middle" class="head">4주 면접</text><text x="1022.25" y="315" text-anchor="middle" class="body">사업·고객·성과</text><text x="1022.25" y="345" text-anchor="middle" class="body">답변·다음 계획</text><rect x="180" y="535" width="840" height="65" rx="32" fill="#17324D"/><text x="600" y="575" text-anchor="middle" class="foot" fill="#fff">지원판정 → 준비 → 실행 → 기록 → 개선의 순환을 다음 달에도 반복한다</text></svg>