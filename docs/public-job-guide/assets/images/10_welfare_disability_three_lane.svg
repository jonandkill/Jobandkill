<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc"><title id="title">두 조건이 겹치는 공고만 기다리지 않는다</title><desc id="desc">직무 적합 일반공고 사회복지사 활용공고 장애인 우대와 제한경쟁을 함께 탐색하는 세 갈래 전략</desc><defs><style>text{font-family:"Pretendard","Noto Sans KR",sans-serif;fill:#17324D}.title{font-size:34px;font-weight:800}.sub{font-size:17px;fill:#52606D}.head{font-size:19px;font-weight:800}.body{font-size:14px;fill:#52606D}.num{font-size:16px;font-weight:900;fill:#fff}.foot{font-size:16px;font-weight:800}</style><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 10 5 0 10z" fill="#2477B3"/></marker></defs><rect width="1200" height="675" fill="#F7FAFC"/><text x="60" y="65" class="title">두 조건이 겹치는 공고만 기다리지 않는다</text><text x="60" y="96" class="sub">세 갈래를 함께 탐색해 기회를 넓히고 우대조건을 정확히 활용한다</text><rect x="46" y="175" width="357.3333333333333" height="290" rx="18" fill="#EAF4FA" stroke="#2477B3" stroke-width="2"/><circle cx="80" cy="213" r="20" fill="#2477B3"/><text x="80" y="220" text-anchor="middle" class="num">1</text><text x="224.66666666666666" y="267" text-anchor="middle" class="head">일반공고</text><text x="224.66666666666666" y="315" text-anchor="middle" class="body">직무 적합성</text><text x="224.66666666666666" y="345" text-anchor="middle" class="body">일반전형 가점</text><path d="M403.3333333333333 320 H417.3333333333333" stroke="#2477B3" stroke-width="4" marker-end="url(#arrow)"/><rect x="421.3333333333333" y="175" width="357.3333333333333" height="290" rx="18" fill="#FFF1D6" stroke="#D97706" stroke-width="2"/><circle cx="455.3333333333333" cy="213" r="20" fill="#D97706"/><text x="455.3333333333333" y="220" text-anchor="middle" class="num">2</text><text x="600" y="267" text-anchor="middle" class="head">사회복지사</text><text x="600" y="315" text-anchor="middle" class="body">필수·급수·경력</text><text x="600" y="345" text-anchor="middle" class="body">우대 적용단계</text><path d="M778.6666666666666 320 H792.6666666666666" stroke="#2477B3" stroke-width="4" marker-end="url(#arrow)"/><rect x="796.6666666666666" y="175" width="357.3333333333333" height="290" rx="18" fill="#EEF2F6" stroke="#52606D" stroke-width="2"/><circle cx="830.6666666666666" cy="213" r="20" fill="#52606D"/><text x="830.6666666666666" y="220" text-anchor="middle" class="num">3</text><text x="975.3333333333333" y="267" text-anchor="middle" class="head">장애인 채용</text><text x="975.3333333333333" y="315" text-anchor="middle" class="body">제한경쟁·가점</text><text x="975.3333333333333" y="345" text-anchor="middle" class="body">편의지원 기한</text><rect x="180" y="535" width="840" height="65" rx="32" fill="#17324D"/><text x="600" y="575" text-anchor="middle" class="foot" fill="#fff">세 갈래를 지원 포트폴리오에 담고 최종 판정은 최신 공고 원문으로 한다</text></svg>