<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1131" viewBox="0 0 800 1131" role="img" aria-labelledby="title desc"><title id="title">B · 프리미엄 에디토리얼형 축소 시안</title><desc id="desc">undefined</desc><rect width="800" height="1131" fill="#FBF9F4"/><rect x="42" y="42" width="716" height="1047" rx="12" fill="none" stroke="#B2842B" stroke-width="2"/><text x="72" y="105" fill="#B2842B" font-family="Noto Sans KR,sans-serif" font-size="17" font-weight="800">B · 프리미엄 에디토리얼형</text><text x="72" y="185" fill="#17324D" font-family="Noto Sans KR,sans-serif" font-size="34" font-weight="900">공공조직은 어떻게</text><text x="72" y="230" fill="#17324D" font-family="Noto Sans KR,sans-serif" font-size="34" font-weight="900">사고하고 결정하는가</text><rect x="72" y="270" width="120" height="4" fill="#B2842B"/><text x="72" y="330" fill="#52606D" font-family="Noto Sans KR,sans-serif" font-size="15">목적·규정·예산·이해관계자·보고·성과를</text><text x="72" y="361" fill="#52606D" font-family="Noto Sans KR,sans-serif" font-size="15">지원자의 행동과 면접 답변으로 연결한다.</text><rect x="72" y="420" width="656" height="225" rx="18" fill="#FFFFFF" stroke="#B2842B" stroke-width="3"/><text x="104" y="468" fill="#B2842B" font-family="Noto Sans KR,sans-serif" font-size="17" font-weight="900">undefined</text><g font-family="Noto Sans KR,sans-serif" font-size="15" fill="#17324D"><text x="104" y="526">1. 공적 목적과 서비스 대상을 확인한다</text><text x="104" y="568">2. 규정·권한·예산·일정의 제약을 살핀다</text><text x="104" y="610">3. 대안을 비교하고 필요한 시점에 보고한다</text></g><text x="72" y="730" fill="#17324D" font-family="Noto Sans KR,sans-serif" font-size="20" font-weight="900">오늘 적용할 한 문장</text><rect x="72" y="772" width="656" height="155" rx="18" fill="#B2842B" opacity=".12"/><text x="104" y="824" fill="#17324D" font-family="Noto Sans KR,sans-serif" font-size="16" font-weight="800">확인 → 비교 → 협의 → 보고 → 실행 → 기록</text><text x="104" y="870" fill="#52606D" font-family="Noto Sans KR,sans-serif" font-size="14">영웅적인 표현보다 판단 기준과 협업 과정을 말한다.</text><text x="72" y="1045" fill="#52606D" font-family="Noto Sans KR,sans-serif" font-size="12">전국 공공채용, 처음부터 합격까지</text><text x="728" y="1045" text-anchor="end" fill="#17324D" font-family="Noto Sans KR,sans-serif" font-size="12">정대영 · 잡앤킬</text></svg>